# Scratch workflow for H36's macOS port on the h36-macos-wip branch only (not merged to main).
name: PTS macOS WIP

on:
  push:
    branches: [h36-macos-wip]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: pts-macos-wip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pts-macos:
    name: PTS tests (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: git submodule update --init --depth 1 pts/third_party
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - uses: ./.github/actions/setup-go
      - name: The machine
        run: |
          sw_vers; uname -a; sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string
          clang --version; which clang ar dsymutil; node --version; node -p 'process.arch + " " + process.platform'
          ls -l /etc/ssl/cert.pem /etc/ssl/certs || true; ulimit -s; ulimit -n; ulimit -Hn; sysctl kern.maxfilesperproc kern.ipc.somaxconn
          node -p 'JSON.stringify(require("fs").constants)'
          node -p 'process.memoryUsage()' 
      - run: make build
      - name: Smoke
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          cat > hello.pts <<'PTS'
          import { platform, arch } from "pts:process";
          function fib(n: number): number { return n < 2 ? n : fib(n - 1) + fib(n - 2); }
          console.log("hello", platform, arch, fib(25), Math.sin(1), parseInt("zz", 36));
          const sums = [1, 2, 3, 4, 5, 6, 7, 8].par.map((x) => x * x);
          console.log(sums);
          function deep(n: number): number { return deep(n + 1) + 1; }
          try { deep(0); } catch (e) { console.log(String(e)); }
          console.log(new Error("where").stack);
          PTS
          $GITHUB_WORKSPACE/pts-bin/pts build hello.pts -o hello 2>&1 | tail -50
          ls -la; otool -L hello || true
          ./hello; echo "exit $?"
          lldb --batch -o 'breakpoint set --file hello.pts --line 3' -o run -o 'thread backtrace 3' -o 'frame variable' -o kill ./hello 2>&1 | tail -30 || true
          cat > burst.pts <<'PTS'
          import { serve } from "pts:http";
          const server = serve({ port: 0, hostname: "127.0.0.1", fetch() { return new Response("ok"); } });
          for (const burst of [100, 120, 140, 200, 400]) {
            const outcomes = await Promise.all(Array.from({ length: burst }, () => fetch(`http://127.0.0.1:${server.port}/`).then((r) => r.text(), (e) => String((e as { cause?: { code?: string } }).cause?.code ?? e))));
            const counts = new Map<string, number>();
            for (const o of outcomes) counts.set(o, (counts.get(o) ?? 0) + 1);
            console.log("pts", burst, [...counts].join(" "));
          }
          server.stop();
          PTS
          cat > burst.mjs <<'NODE'
          import http from "node:http";
          const server = http.createServer((req, res) => res.end("ok"));
          await new Promise((resolve) => server.listen(0, "127.0.0.1", resolve));
          const port = server.address().port;
          for (const burst of [100, 120, 140, 200, 400]) {
            const outcomes = await Promise.all(Array.from({ length: burst }, () => fetch(`http://127.0.0.1:${port}/`).then((r) => r.text(), (e) => String(e.cause?.code ?? e))));
            const counts = new Map();
            for (const o of outcomes) counts.set(o, (counts.get(o) ?? 0) + 1);
            console.log("node", burst, [...counts].join(" "));
          }
          server.close();
          NODE
          $GITHUB_WORKSPACE/pts-bin/pts build burst.pts -o burst && for i in 1 2 3; do ./burst; node burst.mjs; done
      - name: PTS tests
        if: always()
        run: |
          set -o pipefail
          status=0
          PTS_REQUIRE_NODE=1 GOMAXPROCS=3 go test -count=1 -json -p 3 -parallel 3 -timeout 80m ./pts/... ./cmd/pts/ > /tmp/suite.jsonl 2>/tmp/suite.stderr || status=$?
          python3 - <<'PY'
          import json, collections
          res = collections.Counter(); fails = []
          for line in open('/tmp/suite.jsonl'):
              try: e = json.loads(line)
              except Exception: continue
              if e.get('Action') in ('pass', 'fail', 'skip') and e.get('Test'):
                  res[e['Action']] += 1
                  if e['Action'] == 'fail': fails.append(e['Package'].split('/')[-1] + ' ' + e['Test'])
          print(dict(res)); print('\n'.join(fails[:400]))
          PY
          tail -50 /tmp/suite.stderr
          exit $status
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: suite
          path: |
            /tmp/suite.jsonl
            /tmp/suite.stderr

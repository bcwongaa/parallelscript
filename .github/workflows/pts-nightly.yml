# ParallelScript nightly stress run: every program under pts/tests/stress/ (parallel
# programs racing on the scheduler, the pool, the collector and shared data; the
# race-safety invariant, D-L13) 100 times under each of its PTS_THREADS values, on x86-64
# and on arm64 Linux and macOS, whose weaker memory ordering shows what x86's hides (D-225,
# D-228).
name: PTS nightly stress

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      repeat:
        description: Runs of each stress program per thread count
        default: "100"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  stress:
    name: Stress tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only the vendored C libraries; upstream's TypeScript submodule is huge and unused here.
      - run: git submodule update --init --depth 1 pts/third_party
      - uses: ./.github/actions/setup-go
      - name: Install clang
        if: runner.os == 'Linux' # macOS's runner has Apple's
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          clang --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/pts
            ~/Library/Caches/go-build
            ~/Library/Caches/pts
          key: pts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'pts/runtime/**', 'pts/toolchain/**', '.gitmodules') }}
          restore-keys: pts-${{ runner.os }}-${{ runner.arch }}-
      - name: Stress tests
        run: PTS_STRESS_REPEAT=${{ inputs.repeat || '100' }} make test-stress

  publication:
    # Every run and stress program built with the publication checker (D-226): a program
    # that makes a new object reachable by other threads before the store barrier that
    # publishes its construction ends with a report. x86-64 keeps stores in order by
    # itself, so this is how it tests the barriers arm64 needs.
    name: Publication checker (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git submodule update --init --depth 1 pts/third_party
      - uses: ./.github/actions/setup-go
      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          clang --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/pts
          key: pts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'pts/runtime/**', 'pts/toolchain/**', '.gitmodules') }}
          restore-keys: pts-${{ runner.os }}-${{ runner.arch }}-
      - name: Run and stress programs under the publication checker
        run: PTS_BUILD_PROFILE=publication go test -count=1 -timeout 170m -run '^(TestRun|TestStress)$' ./pts/tests/

# ParallelScript CI: builds pts and runs the PTS tests (with the Node differential
# tests required), the upstream Go suites the fork touches, and the VS Code extension's
# tests (its end-to-end suite in a headless VS Code), on every push.
# Upstream's ci.yml only runs on demand in this repo (docs/FORK.md).
name: PTS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: pts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pts:
    name: PTS tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only the vendored C libraries; upstream's TypeScript submodule is huge and unused here.
      - run: git submodule update --init --depth 1 pts/third_party
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: ./.github/actions/setup-go
      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          clang --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/pts
          key: pts-${{ runner.os }}-${{ hashFiles('go.sum', 'pts/runtime/**', 'pts/toolchain/**', '.gitmodules') }}
          restore-keys: pts-${{ runner.os }}-
      - run: make build
      - name: PTS tests (differential tests required)
        run: PTS_REQUIRE_NODE=1 make test
      - run: make test-upstream

  upstream-cli:
    name: Upstream CLI and LSP suites
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: ./.github/actions/setup-go
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: upstream-cli-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: upstream-cli-${{ runner.os }}-
      - run: make test-upstream-cli

  vscode:
    name: VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: ./.github/actions/setup-go
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/pts-vscode-test
          key: vscode-${{ runner.os }}-${{ hashFiles('go.sum', 'pts/editors/vscode/test/e2e/run.mjs') }}
          restore-keys: vscode-${{ runner.os }}-
      # The language server needs only the compiler, not the C runtime's libraries.
      - run: make build
      - run: make vscode
      - name: The extension in a headless VS Code
        run: cd pts/editors/vscode && node test/e2e/run.mjs
